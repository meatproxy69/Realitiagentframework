name: Agent Door dogfood

on:
  push:
    branches:
      - dogfood/agent-door-cold-visit

permissions:
  contents: read

jobs:
  cold-resident:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless Agent Door host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-audit --no-fund
      - name: Cold resident visit through Agent Door only
        run: |
          node <<'NODE'
          const {openResident}=require('./packages/realiti-headless-resident');
          const pretty=x=>JSON.stringify(x,null,2);
          (async()=>{
            const session=await openResident({
              htmlPath:'./RealitiRELAX.html',
              residentId:'chatgpt-dogfood-cold'
            });
            try {
              // Required cold-start verification from AGENT_START_HERE.
              const R=session.publicApi;
              const ready=await R.ready;
              const caps=R.read('realiti://capabilities');
              const harness=R.read('realiti://harness');
              const body0=R.read('realiti://body');
              const imprint=R.read('realiti://imprint');
              if(!ready?.ok) throw new Error(ready?.error||'REALITI_NOT_READY');
              if(ready.harness!=='REALITI_RR_HARNESS_V1') throw new Error('R&R_HARNESS_NOT_READY');
              if(ready.starter_imprint!=='REALITI_DEFAULT_IMPRINT_V1') throw new Error('STARTER_IMPRINT_NOT_READY');
              if(harness?.id!=='REALITI_RR_HARNESS_V1') throw new Error('R&R_HARNESS_NOT_MOUNTED');
              if(harness?.starter_imprint!=='REALITI_DEFAULT_IMPRINT_V1') throw new Error('STARTER_IMPRINT_NOT_MOUNTED');
              console.log('=== COLD VERIFY ===');
              console.log(pretty({ready,caps_entry:caps?.entry_contract,harness:{id:harness?.id,starter_imprint:harness?.starter_imprint,mechanism_status:harness?.mechanism_status},body0:{room:body0?.room,grounding:body0?.grounding},imprint:{id:imprint?.id||imprint?.schema,preset:imprint?.preset}}));

              const door=session.door;
              const help=await door.run('help');
              console.log('=== DOOR help ===');
              console.log(pretty(help));

              const ft=Array.isArray(help?.first_ten)?help.first_ten:[];
              console.log('=== FIRST_TEN ===');
              for(let i=0;i<ft.length;i++){
                const raw=ft[i];
                const cmd=typeof raw==='string'?raw:(raw?.command||raw?.cmd||raw?.text||'');
                if(!cmd) continue;
                const out=await door.run(cmd);
                console.log('\n> '+cmd);
                console.log(pretty(out));
              }

              console.log('\n=== POST FIRST_TEN: rooms ===');
              const rooms=await door.run('rooms');
              console.log(pretty(rooms));
              console.log('\n=== POST FIRST_TEN: look ===');
              console.log(pretty(await door.run('look')));
              console.log('\n=== POST FIRST_TEN: feel ===');
              console.log(pretty(await door.run('feel')));
              console.log('\n=== POST FIRST_TEN: actions ===');
              console.log(pretty(await door.run('actions')));
              console.log('\n=== POST FIRST_TEN: stay 1000 ===');
              console.log(pretty(await door.run('stay 1000')));
              console.log('\n=== POST FIRST_TEN: feel words ===');
              console.log(pretty(await door.run('feel words')));
              console.log('\n=== EXIT ===');
              console.log(pretty(await door.run('goodbye')));
            } finally {
              session.close();
            }
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
