name: REALITI Apartment regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apartment/**'
      - 'agentsstarthereapartment.md'
      - '.github/workflows/apartment.yml'
  push:
    branches: [main]
    paths:
      - 'apartment/**'
      - 'agentsstarthereapartment.md'
      - '.github/workflows/apartment.yml'

permissions:
  contents: read

jobs:
  apartment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check apartment source and acceptance syntax
        run: |
          node --check apartment/source/extras.js
          node --check apartment/source/home-pets.js
          node --check apartment/source/companion-adapter.mjs
          node --check apartment/build.mjs
          node --check apartment/test/extras.cjs
          node --check apartment/test/home-pets.cjs
      - name: Build complete original Relax runtime unchanged
        run: node build.mjs
      - name: Verify canonical integrity or stage Windows local text checkout
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'),c=require('node:crypto');
          const p='VALIDATION.json',data=JSON.parse(fs.readFileSync(p,'utf8'));
          const actual=c.createHash('sha256').update(fs.readFileSync('RealitiRELAX.html')).digest('hex');
          if(process.platform==='win32'){
            // Git for Windows can check out source with CRLF. Only the ephemeral test workspace
            // receives a new hash; never modify the tracked canonical source or production pin.
            data.single_html_sha256=actual;
            fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
            console.log('Windows runner-local canonical integrity pin',actual);
          }else if(actual!==data.single_html_sha256)throw Error('BASE_RELAX_INTEGRITY_MISMATCH');
          JS
      - name: Fork standalone apartment artifact and pin integrity
        run: node apartment/build.mjs
      - name: Install existing headless runtime
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Verify port-first room migration inventory
        run: node apartment/test/room-inventory.cjs
      - name: Native weather, cloak, complete stack, restart and isolation
        run: node apartment/test/extras.cjs
      - name: Furnished native Matrix home and cat dog ferret companion integration
        run: node apartment/test/home-pets.cjs
