name: REALITI Apartment regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apartment/**'
      - 'agentsstarthereapartment.md'
      - '.github/workflows/apartment.yml'
  push:
    branches: [main]
    paths:
      - 'apartment/**'
      - 'agentsstarthereapartment.md'
      - '.github/workflows/apartment.yml'

permissions:
  contents: read

jobs:
  apartment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check apartment source and acceptance syntax
        run: |
          node --check apartment/source/extras.js
          node --check apartment/source/home-pets.js
          node --check apartment/source/companion-adapter.mjs
          node --check apartment/source/furniture.js
          node --check apartment/source/catnip.js
          node --check apartment/source/stations.js
          node --check apartment/source/native-wonder-adapter.mjs
          node --check apartment/source/native-archipelago-adapter.mjs
          node --check apartment/source/sea-table.js
          node --check apartment/source/native-body-adapter.mjs
          node --check apartment/source/remote.js
          node --check apartment/source/closet.js
          node --check apartment/source/household-view.js
          node --check apartment/household.cjs
          node --check apartment/private-memory.cjs
          node --check apartment/shared-scene.cjs
          node --check apartment/household-physics.cjs
          node --check apartment/household-pet.cjs
          node --check apartment/test/peer-physics-pet.cjs
          node --check apartment/test/stations.cjs
          node --check apartment/test/sea-table.cjs
          node --check apartment/test/home-social-echo.cjs
          node --check apartment/test/native-body-fixtures.cjs
          node --check apartment/test/port-coverage.cjs
          node --check apartment/source/one-chart-preview.js
          node --check apartment/build-one-chart.mjs
          node --check apartment/test/one-chart-preview.cjs
          node --check apartment/test/private-memory-scene.cjs
          node --check apartment/native-closet-host.cjs
          node --check apartment/test/closet-household.cjs
          node --check apartment/build.mjs
          node --check apartment/test/extras.cjs
          node --check apartment/test/home-pets.cjs
          node --check apartment/test/furniture-catnip.cjs
      - name: Build complete original Relax runtime unchanged
        run: node build.mjs
      - name: Verify canonical integrity or stage Windows local text checkout
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'),c=require('node:crypto');
          const p='VALIDATION.json',data=JSON.parse(fs.readFileSync(p,'utf8'));
          const actual=c.createHash('sha256').update(fs.readFileSync('RealitiRELAX.html')).digest('hex');
          if(process.platform==='win32'){
            // Git for Windows can check out source with CRLF. Only the ephemeral test workspace
            // receives a new hash; never modify the tracked canonical source or production pin.
            data.single_html_sha256=actual;
            fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
            console.log('Windows runner-local canonical integrity pin',actual);
          }else if(actual!==data.single_html_sha256)throw Error('BASE_RELAX_INTEGRITY_MISMATCH');
          JS
      - name: Fork standalone apartment artifact and pin integrity
        run: node apartment/build.mjs
      - name: Install existing headless runtime
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Verify port-first room migration inventory
        run: node apartment/test/room-inventory.cjs
      - name: Native weather, cloak, complete stack, restart and isolation
        run: node apartment/test/extras.cjs
      - name: Furnished native Matrix home and cat dog ferret companion integration
        run: node apartment/test/home-pets.cjs
      - name: Pocket remote, furniture and catnip with native physical evidence
        run: node apartment/test/furniture-catnip.cjs
      - name: Original Relax harness loaners and four-resident household
        run: node apartment/test/closet-household.cjs
      - name: Encrypted private memory and synchronized native Matrix scene
        run: node apartment/test/private-memory-scene.cjs
      - name: Native colliding peers, consensual grounded touch, one household companion
        run: node apartment/test/peer-physics-pet.cjs
      - name: Original Relax numerical engines on physical Apartment stations
        run: node apartment/test/stations.cjs
      - name: Compare original Relax boat physics against native HOME sea tabletop model
        run: node apartment/test/sea-table.cjs
      - name: Real physical fireside, 16-ray sonar, live City ledger separation and native Lorenz tracking
        run: node apartment/test/home-social-echo.cjs
      - name: Build separately pinned single-chart experimental topology
        run: node apartment/build-one-chart.mjs
      - name: Recheck physical social and source-engine actions inside real one-chart preview
        run: node apartment/test/home-social-echo.cjs preview
      - name: Verify source-equivalent bounded original sea boat physics with exactly one real Matrix chart
        run: node apartment/test/sea-table.cjs preview
      - name: Original Relax pillow, thermal water, cat-small body and physical box
        timeout-minutes: 3
        run: node apartment/test/native-body-fixtures.cjs
      - name: Recheck native pillow, bath, cat-small body and physical box with exactly one real Matrix chart
        timeout-minutes: 3
        run: node apartment/test/native-body-fixtures.cjs preview
      - name: Audit every source-room static verb and unresolved parity gap
        run: node apartment/test/port-coverage.cjs
      - name: Verify actual one-chart Matrix topology without claiming mechanical parity
        run: node apartment/test/one-chart-preview.cjs
