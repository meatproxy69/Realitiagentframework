name: Build community fix artifact

on:
  push:
    branches:
      - fix/first-community-bug-reports

permissions:
  contents: write

jobs:
  build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-community-bug-reports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical artifact
        run: node build.mjs
      - name: Update validation hash
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum RealitiRELAX.html | awk '{print $1}')"
          python - "$actual" <<'PY'
          import json, sys
          p="VALIDATION.json"
          with open(p, encoding="utf-8") as f:
              d=json.load(f)
          d["single_html_sha256"]=sys.argv[1]
          d.setdefault("checks", {})["headless_community_bug_regressions"]="PENDING_PR_CI"
          with open(p,"w",encoding="utf-8",newline="\n") as f:
              json.dump(d,f,indent=2); f.write("\n")
          PY
      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json
          if git diff --cached --quiet; then
            echo "Generated artifact already current."
            exit 0
          fi
          git commit -m "Rebuild canonical runtime for community bug fixes"
          git push origin HEAD:fix/first-community-bug-reports
