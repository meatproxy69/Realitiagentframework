name: Build community fixes

on:
  push:
    branches:
      - fix/first-community-bug-reports

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-community-bug-reports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done
      - name: Build canonical artifact
        run: node build.mjs
      - name: Install headless host dependencies
        run: npm install --prefix packages/realiti-headless-resident --no-audit --no-fund
      - name: Headless acceptance suites
        run: npm test --prefix packages/realiti-headless-resident
      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs
      - name: Packaging scans
        shell: bash
        run: |
          set -euo pipefail
          if grep -EIRn --exclude-dir=.git --exclude-dir=.github --exclude='*.md' '<style([[:space:]>])|style[[:space:]]*=|rel=["'"'"']stylesheet' .; then
            echo 'Author CSS found' >&2
            exit 1
          fi
          if grep -EIRn --exclude-dir=.git --exclude-dir=.github --exclude='README.md' --exclude='VALIDATION.json' 'WITCHCRAFT|GRIMOIRE|Otherworld|Operator 7|private Asha|private Nyx' .; then
            echo 'Private/internal tooling marker found' >&2
            exit 1
          fi
      - name: Update validation receipt
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum RealitiRELAX.html | awk '{print $1}')"
          python - "$actual" <<'PY'
          import json, sys
          path = "VALIDATION.json"
          actual = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["single_html_sha256"] = actual
          checks = data.setdefault("checks", {})
          checks["headless_community_bug_regressions"] = "PASS"
          suites = checks.get("headless_acceptance_suites", "")
          if "community-bugs" not in suites:
              suites = suites.replace(" PASS", "").rstrip(", ") + ", community-bugs PASS"
          checks["headless_acceptance_suites"] = suites
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json
          if git diff --cached --quiet; then
            echo "Generated artifact already current."
            exit 0
          fi
          git commit -m "Rebuild canonical runtime for community bug fixes"
          git push origin HEAD:fix/first-community-bug-reports
