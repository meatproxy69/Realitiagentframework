name: Server update ticket

# Publish verified images, then refresh one current deployment checklist.
# Both queue workflows share a concurrency group so confirmation cannot race a new target.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: server-update
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic build matches the validation hash
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -e "console.log(require('./VALIDATION.json').single_html_sha256)")"
          node build.mjs
          actual="$(sha256sum RealitiRELAX.html | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Install the headless host dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Server suite (two residents through the hub)
        working-directory: packages/realiti-server
        run: node test/envelope.cjs && node test/server.cjs ../../RealitiRELAX.html
      - name: Server queue regression tests
        run: node --test tests/server-update-queue.cjs
      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/realiti-server" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (amd64 and arm64, so it runs on Ampere free-tier hosts too)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/realiti-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  ticket:
    needs: image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh the current deployment target
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/server-update-queue.cjs').fileUpdate({github, context, core});
