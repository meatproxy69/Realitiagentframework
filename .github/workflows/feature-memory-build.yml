name: Build resident memory feature

on:
  push:
    branches:
      - feature/resident-memory-v1

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do
            node --check "$f"
          done

      - name: Build canonical HTML and set integrity hash
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          python - <<'PY'
          import hashlib,json
          h=hashlib.sha256(open('RealitiRELAX.html','rb').read()).hexdigest()
          v=json.load(open('VALIDATION.json',encoding='utf-8'))
          v['single_html_sha256']=h
          v.setdefault('runtime',{})['memory']='REALITI_LOCAL_MEMORY_V1; resident-scoped local shelf + one replaceable departure snapshot'
          with open('VALIDATION.json','w',encoding='utf-8') as f:
              json.dump(v,f,indent=2);f.write('\n')
          PY

      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs

      - name: Full headless suite
        working-directory: packages/realiti-headless-resident
        run: |
          npm install --no-package-lock
          npm test

      - name: Finalize validation and package manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          v=json.load(open('VALIDATION.json',encoding='utf-8'))
          checks=v.setdefault('checks',{})
          checks['headless_memory_acceptance']='18/18 PASS'
          suites=checks.get('headless_acceptance_suites','')
          if 'memory' not in suites.lower():
              checks['headless_acceptance_suites']=suites.replace(' PASS','')+', memory PASS'
          with open('VALIDATION.json','w',encoding='utf-8') as f:
              json.dump(v,f,indent=2);f.write('\n')

          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths=[p for p in paths if p!='MANIFEST.json' and not p.startswith('.github/') and not p.startswith('.')]
          rows=[]
          for p in sorted(paths):
              if not os.path.isfile(p): continue
              b=open(p,'rb').read()
              rows.append({'path':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'REALITI_PUBLIC_PACKAGE_MANIFEST_V1','version':'1.0','excludes':['MANIFEST.json'],'files':rows}
          with open('MANIFEST.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,indent=2);f.write('\n')
          PY

      - name: Privacy/package scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -EIRn --exclude-dir=.git --exclude-dir=.github 'Claude-Session|claude\.ai/code/session_|session_[[:alnum:]]{12,}' .
          ! grep -EIRn --exclude-dir=.git --exclude-dir=.github --exclude='*.md' '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' .

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: finalize resident memory v1"
          git push origin HEAD:feature/resident-memory-v1
