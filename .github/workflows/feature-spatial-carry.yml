name: Validate spatial carry feature

on:
  push:
    branches:
      - feature/spatial-carry-look-presence

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done

      - name: Build standalone
        run: node build.mjs

      - name: Install headless dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock

      - name: Manual Agent Door walk
        shell: bash
        run: |
          node <<'NODE'
          const {openResident}=require('./packages/realiti-headless-resident');
          (async()=>{
            const s=await openResident({htmlPath:'./RealitiRELAX.html',verifyIntegrity:false});
            try{
              const d=s.door,w=s.window;
              await d.run('home');
              const a1=await d.run('actions');
              const take=a1.actions.find(x=>/p14__take__.*HAT/i.test(x.id)||/TAKE .*HAT/i.test(x.label));
              if(!take)throw new Error('manual: no hat take action');
              console.log('TAKE',JSON.stringify(await d.run('act '+take.id)));
              console.log('WALK',JSON.stringify(await d.run('move right 3')));
              const a2=await d.run('actions');
              const place=a2.actions.find(x=>/p14__place__.*HAT/i.test(x.id)||/PLACE .*HAT/i.test(x.label));
              if(!place)throw new Error('manual: no hat place action');
              console.log('PLACE',JSON.stringify(await d.run('act '+place.id)));
              const near=await d.run('nearby hat');console.log('NEARBY',JSON.stringify(near));
              if(!near.nearby?.length||near.nearby[0].distance_m>.8)throw new Error('manual: placed hat not nearby');
              const look=await d.run('look');console.log('LOOK',JSON.stringify(look));
              if(!look.spatial_line)throw new Error('manual: look missing spatial line');
              await d.run('go SIDE_BY_SIDE_FIRESIDE');
              const berth=w.REALITI_MATRIX_V1.entities()['fireside.berth_b'];
              if(!berth.tags.includes('empty'))throw new Error('manual: empty berth not derived');
              w.REALITI_MATRIX_V1.enter('SIDE_BY_SIDE_FIRESIDE','resident:guest');w.REALITI_MATRIX_WORLD_V1.sync();
              console.log('FIRESIDE',berth.tags,w.eval('C9SCENES.SIDE_BY_SIDE_FIRESIDE.intro'));
              if(!berth.tags.includes('occupied')||berth.tags.includes('empty'))throw new Error('manual: guest presence not derived');
            } finally {s.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Full headless suite
        working-directory: packages/realiti-headless-resident
        run: npm test

      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs

      - name: Refresh validation hash and manifest
        shell: bash
        run: |
          python <<'PY'
          import hashlib,json,os,subprocess
          html=open('RealitiRELAX.html','rb').read()
          v=json.load(open('VALIDATION.json',encoding='utf-8'))
          v['single_html_sha256']=hashlib.sha256(html).hexdigest()
          v.setdefault('checks',{})['headless_matrix_acceptance']='PASS'
          with open('VALIDATION.json','w',encoding='utf-8') as f: json.dump(v,f,indent=2);f.write('\n')
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          rows=[]
          for p in sorted(paths):
            if p=='MANIFEST.json' or p.startswith('.github/') or p.startswith('.') or not os.path.isfile(p): continue
            b=open(p,'rb').read(); rows.append({'path':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          m={'schema':'REALITI_PUBLIC_PACKAGE_MANIFEST_V1','version':'1.0','excludes':['MANIFEST.json'],'files':rows}
          with open('MANIFEST.json','w',encoding='utf-8') as f: json.dump(m,f,indent=2);f.write('\n')
          PY

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh spatial carry feature"
          git push origin HEAD:feature/spatial-carry-look-presence
