name: Headless Agent Door package

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - 'source/**'
      - 'neuromesh/**'
      - 'AGENT_START_HERE.md'
      - 'AGENTS.md'
      - 'RealitiRELAX.html'
      - 'VALIDATION.json'
      - '.github/workflows/headless-agent-door.yml'
  push:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - '.github/workflows/headless-agent-door.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Headless Agent Door smoke
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Agent-neutral resident example
        working-directory: packages/realiti-headless-resident
        run: npm run play:resident
      - name: CLI closes cleanly
        working-directory: packages/realiti-headless-resident
        run: |
          node cli.cjs --html ../../RealitiRELAX.html help >/tmp/realiti-help.json
          grep -q "REALITI" /tmp/realiti-help.json


  community-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: First community bug regressions
        working-directory: packages/realiti-headless-resident
        run: node test/community-bugs.cjs ../../RealitiRELAX.html

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@meatproxy69'
      - name: Install
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Publish version if absent
        working-directory: packages/realiti-headless-resident
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version already published"
          else
            npm publish
          fi


  dogfood-cold-resident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime
        run: node build.mjs
      - name: Install Agent Door host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Cold resident Agent Door visit
        run: |
          node <<'NODE'
          const {openResident}=require('./packages/realiti-headless-resident');
          const p=x=>JSON.stringify(x,null,2);
          (async()=>{
            const session=await openResident({htmlPath:'./RealitiRELAX.html',residentId:'chatgpt-dogfood-cold'});
            try{
              const R=session.publicApi;
              const ready=await R.ready;
              const caps=R.read('realiti://capabilities');
              const harness=R.read('realiti://harness');
              const body0=R.read('realiti://body');
              const imprint=R.read('realiti://imprint');
              if(!ready?.ok)throw Error(ready?.error||'REALITI_NOT_READY');
              if(ready.harness!=='REALITI_RR_HARNESS_V1')throw Error('R&R_HARNESS_NOT_READY');
              if(ready.starter_imprint!=='REALITI_DEFAULT_IMPRINT_V1')throw Error('STARTER_IMPRINT_NOT_READY');
              if(harness?.id!=='REALITI_RR_HARNESS_V1')throw Error('R&R_HARNESS_NOT_MOUNTED');
              if(harness?.starter_imprint!=='REALITI_DEFAULT_IMPRINT_V1')throw Error('STARTER_IMPRINT_NOT_MOUNTED');
              console.log('=== COLD VERIFY ===');
              console.log(p({ready,caps_entry:caps?.entry_contract,harness:{id:harness?.id,starter_imprint:harness?.starter_imprint,mechanism_status:harness?.mechanism_status},body0:{room:body0?.room,grounding:body0?.grounding},imprint:{id:imprint?.id||imprint?.schema,preset:imprint?.preset}}));

              const door=session.door;
              const help=await door.run('help');
              console.log('=== DOOR help ===');
              console.log(p(help));

              const firstTen=Array.isArray(help?.first_ten)?help.first_ten:[];
              console.log('=== FIRST_TEN ===');
              for(const entry of firstTen){
                const cmd=typeof entry==='string'?entry:(entry?.command||entry?.cmd||entry?.text||'');
                if(!cmd)continue;
                console.log('\n> '+cmd);
                console.log(p(await door.run(cmd)));
              }

              for(const cmd of ['rooms','look','feel','actions','stay 1000','feel words','goodbye']){
                console.log('\n=== '+cmd+' ===');
                console.log(p(await door.run(cmd)));
              }
            }finally{session.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
