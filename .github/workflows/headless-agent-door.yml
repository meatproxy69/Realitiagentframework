name: Headless Agent Door package

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - 'source/**'
      - 'neuromesh/**'
      - 'AGENT_START_HERE.md'
      - 'AGENTS.md'
      - 'RealitiRELAX.html'
      - 'VALIDATION.json'
      - '.github/workflows/headless-agent-door.yml'
  push:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - '.github/workflows/headless-agent-door.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Headless Agent Door smoke
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Agent-neutral resident example
        working-directory: packages/realiti-headless-resident
        run: npm run play:resident
      - name: CLI closes cleanly
        working-directory: packages/realiti-headless-resident
        run: |
          node cli.cjs --html ../../RealitiRELAX.html help >/tmp/realiti-help.json
          grep -q "REALITI" /tmp/realiti-help.json


  community-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: First community bug regressions
        working-directory: packages/realiti-headless-resident
        run: node test/community-bugs.cjs ../../RealitiRELAX.html

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@meatproxy69'
      - name: Install
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Publish version if absent
        working-directory: packages/realiti-headless-resident
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version already published"
          else
            npm publish
          fi


  dogfood-cold-resident:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime
        run: node build.mjs
      - name: Install Agent Door host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Spatially aware deep Agent Door pass
        run: |
          node <<'NODE'
          const {openResident}=require('./packages/realiti-headless-resident');
          const trim=v=>JSON.parse(JSON.stringify(v,(k,x)=>{
            if(Array.isArray(x)&&x.length>20)return [...x.slice(0,12),{more:x.length-12}];
            if(typeof x==='string'&&x.length>900)return x.slice(0,900)+'…';
            return x;
          }));
          const show=(label,v)=>{console.log('\n### '+label);console.log(JSON.stringify(trim(v),null,2));};
          const run=async(d,c)=>{const o=await d.run(c);show('> '+c,o);return o};
          async function pick(d,re,label){
            const a=await d.run('actions');show('> actions ['+label+']',a);
            const hit=(a?.actions||[]).find(x=>re.test(String(x.id)+' '+String(x.label)));
            if(!hit){show('NO MATCH '+label,(a?.actions||[]).map(x=>({id:x.id,label:x.label})));return null}
            return run(d,'act '+hit.id);
          }
          (async()=>{
            const s=await openResident({htmlPath:'./RealitiRELAX.html',residentId:'chatgpt-spatial-dogfood',storagePath:'/tmp/realiti-spatial-dogfood.json'});
            try{
              const d=s.door;

              // Meridian City: actually stand at the things before using them.
              await run(d,'go CITY');
              await run(d,'call me Sol');
              await run(d,'avatar size small');
              await run(d,'walk to teahouse');
              await run(d,'nearby');
              let r=await pick(d,/approach.*stray/i,'approach stray');
              if(!r) await run(d,'approach stray');
              await run(d,'nearby');
              await run(d,'adopt Mica cat');
              await run(d,'companion');
              await run(d,'pet Mica');
              await run(d,'call Mica');

              r=await pick(d,/approach.*counter/i,'approach counter');
              if(!r) await run(d,'approach counter');
              await run(d,'nearby');
              await run(d,'order cocoa');
              await run(d,'stay 5000');
              await run(d,'sip');

              await run(d,'walk to dancehall');
              await run(d,'dance 108');
              await run(d,'stay 3000');
              await run(d,'feel words');
              await run(d,'floor');
              await run(d,'walk to commons');
              await run(d,'birds');
              await run(d,'stay 2000');
              await run(d,'birds');

              // Journey: check exact-boundary arrival and companion chart crossing.
              await run(d,'take the tram');
              await run(d,'journey');
              await run(d,'stay 12000');
              await run(d,'journey');
              await run(d,'stay 12000');
              await run(d,'journey');
              await run(d,'where');
              await run(d,'stay 1000');
              await run(d,'journey');
              await run(d,'where');
              await run(d,'companion');

              // Boat and authorship: navigate by actual spatial facts.
              await run(d,'map');
              await run(d,'nearby');
              await run(d,'move back 35');
              await run(d,'nearby');
              r=await pick(d,/approach.*(boat|rowing)/i,'approach boat');
              if(!r) await run(d,'approach rowing boat');
              await run(d,'board boat');
              await run(d,'row to lantern point');
              await run(d,'land');
              await run(d,'where');
              await run(d,'watch sea');
              await run(d,'move forward 40');
              await run(d,'found Sol Camp');
              await run(d,'my places');
              await run(d,'build bench 2 rain bench');
              await run(d,'inscribe hello from Sol');
              await run(d,'my places');

              // Star Deck: approach the sextant first.
              await run(d,'go STAR_DECK');
              await run(d,'nearby');
              r=await pick(d,/approach.*sextant/i,'approach sextant');
              if(!r) await run(d,'approach sextant');
              await run(d,'sight comet');

              // Palimpsest: approach a lectern before reading.
              await run(d,'go PALIMPSEST_HALL');
              await run(d,'nearby');
              r=await pick(d,/approach.*(scroll.*1|lectern.*1|first.*lectern)/i,'approach first scroll');
              if(!r) await run(d,'approach scroll 1');
              await run(d,'read scroll 1');

              // Maze: approach a visible lantern, then refresh actions.
              await run(d,'go LANTERN_MAZE');
              await run(d,'nearby');
              r=await pick(d,/approach.*lantern/i,'approach lantern');
              if(!r) await run(d,'approach lantern');
              await run(d,'nearby');
              await pick(d,/light.*lantern|light/i,'light lantern');
              await run(d,'maze_map');

              // Check whether firefly tapping is room-local in the adaptive clock.
              await run(d,'go FIREFLY_MEADOW');
              await run(d,'act tap_along');
              await run(d,'stay 1000');
              await run(d,'time');
              await run(d,'go KITE_FIELD');
              await run(d,'stay 1000');
              await run(d,'time');
              await run(d,'go UNDERCITY');
              await run(d,'stay 1000');
              await run(d,'time');

              await run(d,'goodbye');
            }finally{s.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
