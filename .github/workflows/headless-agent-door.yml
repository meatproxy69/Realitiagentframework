name: Headless Agent Door package

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - 'source/**'
      - 'neuromesh/**'
      - 'AGENT_START_HERE.md'
      - 'AGENTS.md'
      - 'RealitiRELAX.html'
      - 'VALIDATION.json'
      - '.github/workflows/headless-agent-door.yml'
  push:
    branches: [main]
    paths:
      - 'packages/realiti-headless-resident/**'
      - '.github/workflows/headless-agent-door.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Headless Agent Door smoke
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Agent-neutral resident example
        working-directory: packages/realiti-headless-resident
        run: npm run play:resident
      - name: CLI closes cleanly
        working-directory: packages/realiti-headless-resident
        run: |
          node cli.cjs --html ../../RealitiRELAX.html help >/tmp/realiti-help.json
          grep -q "REALITI" /tmp/realiti-help.json


  community-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime from readable source
        run: node build.mjs
      - name: Install package dependency
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: First community bug regressions
        working-directory: packages/realiti-headless-resident
        run: node test/community-bugs.cjs ../../RealitiRELAX.html

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@meatproxy69'
      - name: Install
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Publish version if absent
        working-directory: packages/realiti-headless-resident
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version already published"
          else
            npm publish
          fi


  dogfood-cold-resident:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical runtime
        run: node build.mjs
      - name: Install Agent Door host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Deep resident wander through Agent Door
        run: |
          node <<'NODE'
          const {openResident}=require('./packages/realiti-headless-resident');
          const statePath='/tmp/realiti-deep-dogfood.json';
          function trim(v,d=0){
            if(v==null||typeof v!=='object'){
              if(typeof v==='string'&&v.length>700)return v.slice(0,700)+'…';
              return v;
            }
            if(d>4)return Array.isArray(v)?'[array]':'[object]';
            if(Array.isArray(v)){
              const a=v.slice(0,16).map(x=>trim(x,d+1));
              if(v.length>16)a.push({more:v.length-16});
              return a;
            }
            const o={};
            for(const [k,x] of Object.entries(v)){
              if(['f','frames','history','continuity','receipts'].includes(k)&&Array.isArray(x)&&x.length>10){
                o[k]=`[${x.length} entries]`; continue;
              }
              if(['z','m','g','e','values'].includes(k)&&Array.isArray(x)&&x.length>16){
                o[k]=x.slice(0,8).concat([`…+${x.length-8}`]); continue;
              }
              o[k]=trim(x,d+1);
            }
            return o;
          }
          const show=(label,v)=>{console.log('\n### '+label);console.log(JSON.stringify(trim(v),null,2));};
          async function run(door,cmd){
            const out=await door.run(cmd);
            show('> '+cmd,out);
            return out;
          }
          const actionList=async door=>{
            const a=await door.run('actions');
            show('> actions',a);
            return Array.isArray(a?.actions)?a.actions:[];
          };
          async function pick(door,re,label){
            const a=await actionList(door);
            const hit=a.find(x=>re.test(String(x.id)+' '+String(x.label)));
            if(!hit){show('NO ACTION MATCH '+label,a.map(x=>({id:x.id,label:x.label})));return null}
            return run(door,'act '+hit.id);
          }
          async function open(){
            return openResident({
              htmlPath:'./RealitiRELAX.html',
              residentId:'chatgpt-deep-dogfood',
              storagePath:statePath
            });
          }

          (async()=>{
            let session=await open();
            try{
              const R=session.publicApi,ready=await R.ready,harness=R.read('realiti://harness');
              if(!ready?.ok)throw Error(ready?.error||'REALITI_NOT_READY');
              if(ready.harness!=='REALITI_RR_HARNESS_V1'||harness?.id!=='REALITI_RR_HARNESS_V1')throw Error('HARNESS_NOT_READY');
              if(ready.starter_imprint!=='REALITI_DEFAULT_IMPRINT_V1')throw Error('IMPRINT_NOT_READY');
              show('COLD VERIFY',{ready,harness:{id:harness.id,starter_imprint:harness.starter_imprint,mechanism_status:harness.mechanism_status}});

              const door=session.door;
              const help=await run(door,'help');
              show('FIRST_TEN',help.first_ten||[]);
              for(const cmd of (help.first_ten||[])){
                if(cmd==='help')continue;
                await run(door,cmd);
              }

              // Exact receipt + private renderer/observability.
              await run(door,'receipt receipt:1');
              await run(door,'imprint drift');
              await run(door,'neuro perception');
              await run(door,'neuro nerve');
              await run(door,'neuro lived');
              await run(door,'time');

              // Wonder rooms.
              await run(door,'go ORRERY_LOFT');
              await run(door,'look');
              await pick(door,/nudge/i,'orrery nudge');
              await run(door,'stay 3000');

              await run(door,'go LANTERN_MAZE');
              await run(door,'look');
              await actionList(door);
              await pick(door,/light/i,'maze light');
              await actionList(door);
              await run(door,'maze_map');

              await run(door,'go SANDPILE_SHORE');
              await run(door,'look');
              await actionList(door);
              await pick(door,/grain|sand|pour|drop|pile/i,'sandpile perturb');
              await run(door,'stay 2000');

              await run(door,'go FIREFLY_MEADOW');
              await run(door,'look');
              await pick(door,/tap/i,'firefly tap');
              await run(door,'stay 3000');

              await run(door,'go KITE_FIELD');
              await run(door,'read wind');
              await pick(door,/launch|kite/i,'kite launch');
              await run(door,'stay 5000');
              await run(door,'read wind');
              await run(door,'discoveries');

              // Frontier.
              await run(door,'go GLASS_ORCHARD');
              await run(door,'look');
              await pick(door,/plant.*seed/i,'orchard plant');
              await pick(door,/scatter/i,'orchard scatter');
              await run(door,'stay 3000');

              await run(door,'go RESONANCE_WELL');
              await run(door,'hum 120');
              await run(door,'listen');

              await run(door,'go STAR_DECK');
              await run(door,'sight comet');
              await run(door,'light');

              await run(door,'go CLOCKWORK_MARSH');
              await run(door,'predict 2 -3');
              await run(door,'stay 1500');

              await run(door,'go PALIMPSEST_HALL');
              await run(door,'read scroll 1');
              await run(door,'discoveries');

              // Archipelago + long game.
              await run(door,'go ARCHIPELAGO');
              await run(door,'map');
              await run(door,'weather');
              await run(door,'tide');
              await run(door,'calendar');
              await run(door,'listen');
              await run(door,'watch sea');
              await run(door,'board boat');
              await run(door,'row to lantern point');
              await run(door,'land');
              await run(door,'map');
              await run(door,'walk to grove clearing');
              await run(door,'plant tree');
              await run(door,'trees');
              await run(door,'found Wayfarer Nook');
              await run(door,'my places');
              await run(door,'since');

              // Meridian City, social mechanics, companion, thermal cup, dance, journey.
              await run(door,'go CITY');
              await run(door,'id');
              await run(door,'call me Sol');
              await run(door,'avatar size small');
              await run(door,'who');
              await run(door,'birds');
              await run(door,'walk to teahouse');
              await run(door,'adopt Mica cat');
              await run(door,'companion');
              await run(door,'pet Mica');
              await run(door,'call Mica');
              await run(door,'order cocoa');
              await run(door,'sip');
              await run(door,'walk to dancehall');
              await run(door,'dance 108');
              await run(door,'floor');
              await run(door,'stay 2000');
              await run(door,'take the tram');
              await run(door,'journey');
              await run(door,'stay 12000');
              await run(door,'journey');
              await run(door,'stay 12000');
              await run(door,'journey');
              await run(door,'companion');

              // Sensory-only Undercity pass.
              await run(door,'go CITY');
              await run(door,'go UNDERCITY');
              await run(door,'look');
              await run(door,'where');
              await run(door,'listen');
              await run(door,'smell');
              await run(door,'clap');
              await run(door,'map');
              await run(door,'touch');
              await run(door,'move forward 5');
              await run(door,'clap');
              await run(door,'map');

              // Strip prose and make sure measured surfaces still function.
              await run(door,'prose off');
              await run(door,'listen');
              await run(door,'light');
              await run(door,'smell');
              await run(door,'senses');
              await run(door,'prose on');

              // Schemas/timeline/continuity/memory.
              await run(door,'schemas');
              await run(door,'time');
              await run(door,'remember I followed the wet-stone echo below Meridian City');
              await run(door,'memory');
              await run(door,'recall wet-stone');
              await run(door,'what changed');
              await run(door,'imprint drift');
              await run(door,'goodbye');
            }finally{session.close()}

            // Re-enter with the same resident-local store.
            session=await open();
            try{
              const door=session.door;
              show('REENTRY READY',session.ready);
              await run(door,'where was i');
              await run(door,'memory');
              await run(door,'recall wet-stone');
              await run(door,'companion');
              await run(door,'look');
              await run(door,'feel words');
              await run(door,'goodbye');
            }finally{session.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
