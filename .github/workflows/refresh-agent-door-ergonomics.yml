name: Refresh Agent Door ergonomics bundle

on:
  push:
    branches: [fix/agent-door-resident-ergonomics]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-door-resident-ergonomics
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs; do node --check "$f"; done
          node tests/public-contract-smoke.cjs
      - name: Rebuild standalone and hash
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const file=fs.readFileSync('RealitiRELAX.html');
          const hash=crypto.createHash('sha256').update(file).digest('hex');
          const v=JSON.parse(fs.readFileSync('VALIDATION.json','utf8'));
          v.single_html_sha256=hash;
          fs.writeFileSync('VALIDATION.json',JSON.stringify(v,null,2)+'\n');
          console.log(hash);
          NODE
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild public REALITI bundle"
          git push
