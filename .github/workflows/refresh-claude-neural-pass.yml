name: Refresh Claude neural pass

on:
  push:
    branches: [fix/claude-resident-neural-pass]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-resident-neural-pass
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done
      - name: Rebuild standalone and exact hashes
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const html=fs.readFileSync('RealitiRELAX.html');
          const hv=crypto.createHash('sha256').update(html).digest('hex');
          const v=JSON.parse(fs.readFileSync('VALIDATION.json','utf8'));
          v.single_html_sha256=hv;
          fs.writeFileSync('VALIDATION.json',JSON.stringify(v,null,2)+'\n');

          const pp='neuromesh/preset-packs/honeyspark-duo.json';
          const ph=crypto.createHash('sha256').update(fs.readFileSync(pp)).digest('hex');
          const rp='neuromesh/preset-packs/REGISTRY.json';
          const reg=JSON.parse(fs.readFileSync(rp,'utf8'));
          const row=(reg.entries||[]).find(x=>x.pack_id==='realiti.honeyspark-duo.001');
          if(!row)throw new Error('HoneySpark registry row missing');
          row.pack_sha256=ph;
          fs.writeFileSync(rp,JSON.stringify(reg,null,2)+'\n');
          console.log('HTML '+hv);
          console.log('HONEYSPARK '+ph);
          NODE
      - name: Public source smoke
        run: node tests/public-contract-smoke.cjs
      - name: Install headless host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Claude resident acceptance
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Commit regenerated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json neuromesh/preset-packs/REGISTRY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Claude resident neural pass"
          git push
