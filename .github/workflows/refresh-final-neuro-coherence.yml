name: Refresh final neuro coherence bundle

on:
  push:
    branches: [fix/neuro-resident-coherence]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neuro-resident-coherence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done
      - name: Rebuild
        run: |
          set -euo pipefail
          node build.mjs
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const hash=crypto.createHash('sha256').update(fs.readFileSync('RealitiRELAX.html')).digest('hex');
          const v=JSON.parse(fs.readFileSync('VALIDATION.json','utf8'));
          v.single_html_sha256=hash;
          fs.writeFileSync('VALIDATION.json',JSON.stringify(v,null,2)+'\n');
          console.log(hash);
          NODE
      - name: Public contract
        run: node tests/public-contract-smoke.cjs
      - name: Install
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Full headless suite
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Commit generated artifact
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild final neuro coherence bundle"
          git push
