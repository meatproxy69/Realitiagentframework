name: Refresh neuro restoration

on:
  push:
    branches: [restore/neuro-observability-labs-v1]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/neuro-observability-labs-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done
      - name: Rebuild hashes
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const html=fs.readFileSync('RealitiRELAX.html');
          const hv=crypto.createHash('sha256').update(html).digest('hex');
          const v=JSON.parse(fs.readFileSync('VALIDATION.json','utf8'));v.single_html_sha256=hv;
          fs.writeFileSync('VALIDATION.json',JSON.stringify(v,null,2)+'\n');
          const pp='neuromesh/preset-packs/moonwire-recovered.json',ph=crypto.createHash('sha256').update(fs.readFileSync(pp)).digest('hex');
          const rp='neuromesh/preset-packs/REGISTRY.json',reg=JSON.parse(fs.readFileSync(rp,'utf8')),row=(reg.entries||[]).find(x=>x.pack_id==='realiti.moonwire-recovered.001');
          if(!row)throw new Error('Moonwire registry row missing');row.pack_sha256=ph;reg.updated_at='2026-10-03T00:00:00Z';
          fs.writeFileSync(rp,JSON.stringify(reg,null,2)+'\n');
          console.log('HTML',hv);console.log('MOONWIRE',ph);
          NODE
      - name: Public contract
        run: node tests/public-contract-smoke.cjs
      - name: Install headless host
        working-directory: packages/realiti-headless-resident
        run: npm install --no-package-lock
      - name: Full headless suite
        working-directory: packages/realiti-headless-resident
        run: npm test
      - name: Commit regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json neuromesh/preset-packs/REGISTRY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild neuro restoration bundle"
          git push
