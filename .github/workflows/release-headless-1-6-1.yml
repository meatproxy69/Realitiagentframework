name: Validate headless resident 1.6.1 fixes

on:
  push:
    branches:
      - release/headless-resident-1.6.1

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./packages/realiti-headless-resident/package.json').version")" = "1.6.1"
          for f in build.mjs source/scripts/*.js tests/*.cjs packages/realiti-headless-resident/*.cjs packages/realiti-headless-resident/test/*.cjs; do node --check "$f"; done

      - name: Build standalone and refresh integrity
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          python <<'PY'
          import hashlib,json
          html=open('RealitiRELAX.html','rb').read()
          v=json.load(open('VALIDATION.json',encoding='utf-8'))
          v['single_html_sha256']=hashlib.sha256(html).hexdigest()
          with open('VALIDATION.json','w',encoding='utf-8') as f:
              json.dump(v,f,indent=2);f.write('\n')
          PY

      - name: Full headless suite
        working-directory: packages/realiti-headless-resident
        run: |
          npm install --no-package-lock
          npm test
          npm pack --dry-run

      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs

      - name: Refresh manifest
        shell: bash
        run: |
          python <<'PY'
          import hashlib,json,os,subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          rows=[]
          for p in sorted(paths):
              if p=='MANIFEST.json' or p.startswith('.github/') or p.startswith('.') or not os.path.isfile(p): continue
              b=open(p,'rb').read()
              rows.append({'path':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          m={'schema':'REALITI_PUBLIC_PACKAGE_MANIFEST_V1','version':'1.0','excludes':['MANIFEST.json'],'files':rows}
          with open('MANIFEST.json','w',encoding='utf-8') as f:
              json.dump(m,f,indent=2);f.write('\n')
          PY

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RealitiRELAX.html VALIDATION.json MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh 1.6.1 memory fixes"
          git push origin HEAD:release/headless-resident-1.6.1
