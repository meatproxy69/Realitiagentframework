name: Server update ticket close

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: server-update
  cancel-in-progress: false

jobs:
  close-when-done:
    if: contains(github.event.issue.labels.*.name, 'server-update') && github.event.issue.state == 'open' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Confirm the current deployment as an authorized operator
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/server-update-queue.cjs').closeUpdate({github, context, core});
