name: Validate REALITI Relax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in build.mjs source/scripts/*.js tests/*.cjs; do node --check "$f"; done
      - name: SOMA 3.3 native sensory and physical Lantern Room integration
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/realiti-neuromesh/index.cjs
          node --check packages/realiti-neuromesh/renderers.cjs
          node --check packages/realiti-neuromesh/harness.cjs
          node --check packages/realiti-neuromesh/advanced.cjs
          node --check packages/realiti-neuromesh/field20.cjs
          node --check packages/realiti-neuromesh/sealed-pocket.cjs
          node --check packages/realiti-neuromesh/test/native-parity.test.cjs
          node --check packages/realiti-neuromesh/test/lantern-native-session.test.cjs
          node --check packages/realiti-neuromesh/examples/native-lantern-tour.cjs
          node --check packages/realiti-neuromesh/memory.cjs
          node --check packages/realiti-neuromesh/storage.cjs
          node --check packages/realiti-neuromesh/lab/lantern-room.cjs
          node --check packages/realiti-neuromesh/test/memory.test.cjs
          node --check packages/realiti-neuromesh/test/lab.test.cjs
          node --check packages/realiti-neuromesh/test/harness.test.cjs
          node --check packages/realiti-neuromesh/test/soma.test.cjs
          npm test --prefix packages/realiti-neuromesh
          node packages/realiti-neuromesh/examples/lantern-lab.cjs > /tmp/soma-lantern-room.json
          node -e 'const r=require("/tmp/soma-lantern-room.json"); if(!r.harness.ok||r.departed.grounded!==0||r.live.haloModes!==7||r.live.auraBins!==128)process.exit(1)'
          node packages/realiti-neuromesh/examples/native-lantern-tour.cjs > /tmp/soma-lantern-native-tour.json
          node -e 'const r=require("/tmp/soma-lantern-native-tour.json");console.log("NATIVE LANTERN ROOM RESULT",JSON.stringify({passed:r.passed,failed:r.failed,stages:r.trace.length,world:r.world,real_world_events:r.summary.real_world_events,final_grounded:r.summary.final_grounded,energy:r.summary.energy_audit}));if(r.failed||r.passed<18||r.summary.final_grounded!==0)process.exit(1)'
          node packages/realiti-neuromesh/examples/neighborhood.cjs > /tmp/soma-neighborhood.json
          npm pack --dry-run ./packages/realiti-neuromesh > /tmp/soma-pack.txt
          cmp neuromesh/preset-packs/honeyspark-duo.json packages/realiti-neuromesh/presets/honeyspark-duo.json
          cmp neuromesh/preset-packs/moonwire-recovered.json packages/realiti-neuromesh/presets/moonwire-recovered.json
          for file in neuromesh/schema/*.json neuromesh/templates/*.json neuromesh/MECHANISM_CATALOG.json neuromesh/REGISTRY.json neuromesh/SPEC.md neuromesh/TECH_STACK.md neuromesh/PRESET_PACKS.md neuromesh/preset-packs/REGISTRY.json; do
            cmp "$file" "packages/realiti-neuromesh/reference/${file#neuromesh/}"
          done
      - name: Realiti Matrix spatial authority and signed evidence
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix packages/realiti-matrix
          node packages/realiti-matrix/examples/matrix-to-soma.cjs > /tmp/matrix-soma-verified.json
          node -e 'const x=require("/tmp/matrix-soma-verified.json"); if(x.accepted.grounded!==1||x.release.grounded!==0||x.rejected.afterGrounded!==0||!x.neuralmesh.harnessBoot)process.exit(1)'
          npm pack --dry-run ./packages/realiti-matrix > /tmp/matrix-package-pack.txt
      - name: Deterministic build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c "import json; print(json.load(open('VALIDATION.json'))['single_html_sha256'])")"
          node build.mjs
          actual="$(sha256sum RealitiRELAX.html | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
      - name: Public contract smoke
        run: node tests/public-contract-smoke.cjs
      - name: Public packaging scans
        shell: bash
        run: |
          set -euo pipefail
          if grep -EIRn --exclude-dir=.git --exclude-dir=.github --exclude='*.md' '<style([[:space:]>])|style[[:space:]]*=|rel=["'"'"']stylesheet' .; then
            echo 'Author CSS found' >&2
            exit 1
          fi
          if grep -EIRn --exclude-dir=.git --exclude-dir=.github --exclude='README.md' --exclude='VALIDATION.json' 'WITCHCRAFT|GRIMOIRE|Otherworld|Operator 7|private Asha|private Nyx' .; then
            echo 'Private/internal tooling marker found' >&2
            exit 1
          fi
