<script id="native-matrix-scene-projection">
/* REALITI HOME: pure read-only projection of the actual native Matrix. No rendering/physics. */
(function(factory){
  'use strict';
  const api=Object.freeze(factory());
  if(typeof module==='object'&&module.exports)module.exports=api;
  if(typeof window==='object')Object.defineProperty(window,
   'REALITI_APARTMENT_VISUAL_PROJECTION_V0',{value:api,configurable:false,writable:false});
})(function(){
'use strict';
const HOME='CLOUD_NINE_NEST', SCHEMA='REALITI_APARTMENT_VISUAL_SCENE_V0';
const ID=/^[A-Za-z0-9._:-]{1,120}$/, MAX_ENTITIES=512;
const TAGS=new Set(['floor','ceiling','wall','structure','window','rain','light','lamp',
'furniture','seat','support','bed','mattress','soft','rug','textile','storage',
'books','book','desk','chair','shelf','closet','toy','cat','dog','ferret','companion',
'pet','bedroom-chest','paint-sample','decor','instrument','music','reading','quiet',
'cardboard','tea','pet-bed','play','scratcher','cushion','writing','doorway']);
const fail=s=>{throw Error('VISUAL_SCENE_'+s)};
function vector(v,n,label,limit=100){
 if(!Array.isArray(v)||v.length!==n||!v.every(x=>
   typeof x==='number'&&Number.isFinite(x)&&Math.abs(x)<=limit))fail('INVALID_'+label);
 return v.slice();
}
function positive(v,label){if(typeof v!=='number'||!Number.isFinite(v)||v<=0||v>100)
 fail('INVALID_'+label);return v}
function shape(s){
 if(!s||typeof s!=='object')return null;
 if(s.kind==='BOX'||s.kind==='VOLUME')return {kind:s.kind,
  halfExtents:vector(s.halfExtents,3,'HALF_EXTENTS').map(x=>positive(x,'HALF_EXTENT'))};
 if(s.kind==='SPHERE'||s.kind==='POINT')return {kind:s.kind,
  radius:positive(s.radius,'RADIUS')};
 if(s.kind==='CAPSULE'){
  const radius=positive(s.radius,'RADIUS'),height=positive(s.height,'HEIGHT');
  if(height<2*radius)fail('INVALID_CAPSULE');return {kind:'CAPSULE',radius,height};
 }
 if(s.kind==='PLANE')return {kind:'PLANE'};
 return null;
}
function frozen(x){
 if(x&&typeof x==='object'&&!Object.isFrozen(x)){
  for(const v of Object.values(x))frozen(v);
  Object.freeze(x);
 }
 return x;
}
function projectNative(M){
 if(!M||typeof M.state!=='function'||typeof M.charts!=='function'||
    typeof M.entities!=='function')fail('NATIVE_MATRIX_REQUIRED');
 const charts=M.charts();
 if(!charts||Object.keys(charts).length!==1||!Object.prototype.hasOwnProperty.call(charts,HOME))
  fail('ONE_HOME_CHART_REQUIRED');
 const state=M.state(),viewer=state?.residents?.['resident:self'],room=charts[HOME];
 if(!viewer||viewer.chart!==HOME)fail('RESIDENT_NOT_HOME');
 if(!Number.isSafeInteger(state.revision)||state.revision<0)fail('INVALID_MATRIX_REVISION');
 if(room.bounds?.kind!=='BOX')fail('INVALID_CHART_BOUNDS');
 const entities=[],unsupported=[],raw=Object.values(M.entities());
 if(raw.length>512)fail('ENTITY_LIMIT');
 for(const e of raw){
  if(!e||e.chart!==HOME||e.resident===true)continue;
  if(!ID.test(e.id))fail('INVALID_ENTITY_ID');
  if(e.tags?.some(t=>['private','journal','pocket-key'].includes(t)))continue;
  const s=shape(e.shape);
  if(!s){unsupported.push({id:e.id,kind:String(e.shape?.kind||'none').slice(0,20)});continue}
  if(!e.pose)fail('ENTITY_POSE_MISSING');
  const tags=Array.isArray(e.tags)?e.tags.filter(t=>TAGS.has(t)||
    (typeof t==='string'&&/^(?:accent|theme|bedroom|swatch|palette-role):[a-z0-9-]{1,32}$/.test(t))).slice(0,24):[];
  const material=typeof e.material==='string'&&/^[a-z][a-z0-9_-]{0,30}$/.test(e.material)
    ?e.material:null;
  const label=typeof e.label==='string'?e.label.replace(/[\x00-\x1f\x7f]/g,' ').slice(0,100):e.id;
  entities.push({id:e.id,position:vector(e.pose.position,3,'ENTITY_POSITION'),
   rotation:vector(e.pose.rotation,4,'ENTITY_ROTATION',1.01),shape:s,
   collision:e.collision===true,material,tags,label});
 }
 entities.sort((a,b)=>a.id.localeCompare(b.id,'en'));
 unsupported.sort((a,b)=>a.id.localeCompare(b.id,'en'));
 return frozen({ok:true,schema:SCHEMA,chart:HOME,source:'NATIVE_MATRIX_READ_ONLY',
  matrix_revision:state.revision,coordinate_system:'REALITI_COORDINATE_V1_Z_UP_METERS',
  bounds:{center:vector(room.bounds.center,3,'CHART_CENTER'),
   halfExtents:vector(room.bounds.halfExtents,3,'CHART_SIZE').map(x=>positive(x,'HALF_EXTENT'))},
  viewer:{position:vector(viewer.pose?.position,3,'RESIDENT_POSITION'),
   rotation:vector(viewer.pose?.rotation,4,'RESIDENT_ROTATION',1.01),
   posture:String(viewer.posture||'unknown').slice(0,24)},
  entities,unsupported,visual_only:true,contact_minted:false});
}
return {HOME,SCHEMA,projectNative};
});

</script><script id="matrix-fixed-reference-cameras">
/* Four stable Matrix Z-up camera poses. No physics, no movement. */
(function(factory){
 'use strict';const api=Object.freeze(factory());
 if(typeof module==='object'&&module.exports)module.exports=api;
 if(typeof window==='object')Object.defineProperty(window,'REALITI_APARTMENT_REFERENCE_CAMERAS_V0',
  {value:api,configurable:false,writable:false});
})(function(){
 'use strict';
 const names=Object.freeze([
  Object.freeze({id:'NE',label:'Northeast',sx:1,sy:1}),
  Object.freeze({id:'NW',label:'Northwest',sx:-1,sy:1}),
  Object.freeze({id:'SW',label:'Southwest',sx:-1,sy:-1}),
  Object.freeze({id:'SE',label:'Southeast',sx:1,sy:-1})]);
 const FRAME=Object.freeze({width:640,height:400,halfHeight:9.7,radius:15,elevation:12});
 function referenceViews(scene){
  if(scene?.schema!=='REALITI_APARTMENT_VISUAL_SCENE_V0'||
     scene.chart!=='CLOUD_NINE_NEST')throw Error('REFERENCE_HOME_SNAPSHOT_REQUIRED');
  const center=scene.bounds?.center;
  if(!Array.isArray(center)||center.length!==3||!center.every(Number.isFinite))
   throw Error('REFERENCE_HOME_BOUNDS_REQUIRED');
  const target=[center[0],center[1],1.05];
  return names.map(n=>Object.freeze({id:n.id,label:n.label,
   position:Object.freeze([target[0]+n.sx*FRAME.radius,
     target[1]+n.sy*FRAME.radius,target[2]+FRAME.elevation]),
   target:Object.freeze(target.slice()),up:Object.freeze([0,0,1]),
   camera:'orthographic',frame:FRAME,visual_only:true,contact_minted:false}));
 }
 return {FRAME,referenceViews};
});

</script>
<script id="realiti-visual-input">
/* REALITI visual input: only existing public Agent Door commands mutate the world.
 * Camera and screenshots are spectator presentation; no direct Matrix mutators. */
(function(factory){
 'use strict';const api=Object.freeze(factory());
 if(typeof module==='object'&&module.exports)module.exports=api;
 if(typeof window==='object')Object.defineProperty(window,
  'REALITI_APARTMENT_VISUAL_INPUT_V0',{value:api,configurable:false,writable:false});
})(function(){
 'use strict';
 const MAP=Object.freeze({
  w:'move forward 0.75',ArrowUp:'move forward 0.75',
  s:'move back 0.75',ArrowDown:'move back 0.75',
  a:'turn left 30',ArrowLeft:'turn left 30',
  d:'turn right 30',ArrowRight:'turn right 30'
 });
 const ID=/^[a-zA-Z0-9._:-]{1,120}$/;
 const SCHEMA='REALITI_APARTMENT_VISUAL_SCENE_V0';
 function keyCommand(key){
  const k=typeof key==='string'&&key.length===1?key.toLowerCase():key;
  return Object.hasOwn(MAP,k)?MAP[k]:null;
 }
 function approachCommand(scene,id){
  if(scene?.schema!==SCHEMA||scene.chart!=='CLOUD_NINE_NEST')return null;
  if(typeof id!=='string'||!ID.test(id))return null;
  const e=scene.entities?.find(x=>x.id===id);
  if(!e||!e.shape||!Array.isArray(e.tags))return null;
  if(e.tags.some(x=>['wall','ceiling','floor','portal','doorway'].includes(x)))return null;
  return 'approach '+id;
 }
 function createController({door,snapshot}={}){
  if(typeof door?.run!=='function'||typeof snapshot!=='function')
   throw Error('VISUAL_AGENT_DOOR_REQUIRED');
  let busy=false;
  async function dispatch(command){
   if(!command)return {ok:false,error:'VISUAL_INPUT_UNSUPPORTED'};
   if(busy)return {ok:false,error:'VISUAL_INPUT_BUSY'};
   busy=true;
   try{
    const before=snapshot();
    if(before?.schema!==SCHEMA||before.chart!=='CLOUD_NINE_NEST')
     return {ok:false,error:'VISUAL_NOT_HOME'};
    // The existing Door owns authorization, collision, time and sensory evidence.
    const response=await door.run(command);
    const after=snapshot();
    const ok=response?.ok!==false&&response?.result?.ok!==false;
    return {ok,command,changed:after.matrix_revision!==before.matrix_revision,
      matrix_revision:after.matrix_revision,
      ...(!ok?{reason:String(response?.error||response?.result?.error||'MATRIX_REFUSED').slice(0,100)}:{})};
   }catch(e){
    return {ok:false,command,error:'VISUAL_AGENT_DOOR_FAILED',
      reason:String(e?.message||e).slice(0,120)};
   }finally{busy=false}
  }
  return Object.freeze({
   key(key){return dispatch(keyCommand(key))},
   approach(id){return dispatch(approachCommand(snapshot(),id))},
   busy(){return busy}
  });
 }
 return Object.freeze({keyCommand,approachCommand,createController});
});
</script>
<script>window.REALITI_APARTMENT_VISUAL_V0=Object.freeze({snapshot:()=>window.REALITI_APARTMENT_VISUAL_PROJECTION_V0.projectNative(window.REALITI_TEST_MATRIX)});</script>
<script id="realiti-isolated-native-door">
window.REALITI_AGENT_DOOR=Object.freeze({async run(command){
 const M=window.REALITI_TEST_MATRIX;
 let match;
 if((match=/^turn (left|right) (30)$/.exec(command))){
  M.turn((match[1]==='left'?1:-1)*30);
  return {ok:true,matrix_revision:M.state().revision};
 }
 if((match=/^move (forward|back) (0\.75|20)$/.exec(command))){
  M.moveLocal([0,(match[1]==='forward'?1:-1)*Number(match[2]),0]);
  for(let i=0;i<160;i++)if(!M.step(0.05))break;
  return {ok:true,matrix_revision:M.state().revision,blocked_by:M.resident().last_block||null};
 }
 if((match=/^approach ([A-Za-z0-9._:-]{1,120})$/.exec(command))){
  if(!M.approach(match[1]))return {ok:false,error:'TARGET_NOT_FOUND'};
  for(let i=0;i<160;i++)if(!M.step(0.05))break;
  return {ok:true,matrix_revision:M.state().revision};
 }
 return {ok:false,error:'UNSUPPORTED_NATIVE_DOOR_ACTION'};
}});
</script>

</head><body><header><h1>REALITI HOME · Native Matrix WebGL smoke</h1>Actual Matrix kernel and prebuilt Three.js, isolated furniture fixture (NOT the full Apartment or private resident state).</header>
<pre id="checks">Starting WebGL smoke…</pre>
<script>
(()=>{
const out=document.getElementById('checks');
async function finish(){
 const M=window.REALITI_TEST_MATRIX;
 const before=M.resident().pose.position.slice();
 const controller=window.REALITI_APARTMENT_VISUAL_INPUT_V0.createController({door:window.REALITI_AGENT_DOOR,snapshot:window.REALITI_APARTMENT_VISUAL_V0.snapshot});
 const movement=await controller.key('w');
 const after=M.resident().pose.position.slice();
 const walked=movement.ok&&after[1]>before[1]+.01;
 M.face('CLOUD_NINE_NEST.wall.north');
 const beforeWall=M.resident().pose.position.slice();
 const wallCheck=await window.REALITI_AGENT_DOOR.run('move forward 20');
 const wallPos=M.resident().pose.position.slice();
 const stopped=wallCheck.ok&&wallPos[1]<6.0&&Math.hypot(wallPos[0]-beforeWall[0],wallPos[1]-beforeWall[1])<8.0;
 const imgs=[...document.querySelectorAll('#realiti-visual figure img')],s=window.REALITI_APARTMENT_VISUAL_V0.snapshot();
 await Promise.all(imgs.map(img=>img.decode?.().catch(()=>{})||Promise.resolve()));
 const detail=imgs.length===4&&imgs.every(img=>{
  if(img.naturalWidth!==640||img.naturalHeight!==400)return false;
  const canvas=document.createElement('canvas');
  canvas.width=640;canvas.height=400;
  const g=canvas.getContext('2d');if(!g)return false;
  g.drawImage(img,0,0);
  const pixels=g.getImageData(0,0,640,400).data,seen=new Set();
  for(let y=20;y<380;y+=19)for(let x=20;x<620;x+=19){
   const i=4*(y*640+x);
   seen.add(((pixels[i]>>4)<<8)|((pixels[i+1]>>4)<<4)|(pixels[i+2]>>4));
  }
  return seen.size>=7;
 });
 const passed=detail&&!s.contact_minted&&walked&&stopped;
 out.className=passed?'good':'bad';
 out.textContent='HOME chart: '+s.chart+'\nMatrix entities: '+s.entities.length+
 '\nReference PNGs: '+imgs.length+'\nImage sizes: '+imgs.map(x=>x.naturalWidth+'x'+x.naturalHeight).join(', ')+
 '\nContact minted: '+s.contact_minted+'\nImage detail: '+detail+'\nDoor walking: '+walked+'\nNative wall collision: '+stopped+'\nRESULT: '+(passed?'PASS':'FAIL');
 document.documentElement.dataset.smoke=passed?'pass':'fail';
}
try{
 window.REALITI_APARTMENT_THREE_V0.mount();
 const b=[...document.querySelectorAll('#realiti-visual button')].find(x=>x.textContent==='4 reference views');
 if(!b)throw Error('FOUR_CAMERA_BUTTON_MISSING');
 b.click();setTimeout(finish,650);
}catch(e){out.className='bad';out.textContent='RESULT: FAIL – '+e;document.documentElement.dataset.smoke='fail'}
})();
</script></body></html>
